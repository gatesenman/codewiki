name: CodeWiki PR Impact

# Comments an ontology-based blast-radius / impact analysis on every PR, so
# reviewers immediately see which downstream symbols a change can affect and
# which tests are worth running before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute impact report
        id: impact
        run: |
          BASE="origin/${{ github.base_ref }}"
          npx ts-node cli/codewiki-cli.ts git-diff . --base "$BASE" --json > impact.json || echo '{"error":"analysis failed"}' > impact.json
          node scripts/pr-impact-comment.mjs < impact.json > impact.md
          cat impact.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('impact.md', 'utf8');
            const marker = '<!-- codewiki-impact-bot -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
