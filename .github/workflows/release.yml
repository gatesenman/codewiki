name: Release

# Builds CodeWiki installers for all platforms.
# - On a pushed tag `v*`: builds Windows/macOS/Linux and attaches the installers to the GitHub Release.
# - On manual dispatch or PR: builds and uploads the installers as workflow artifacts (no release).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: "--linux"
          - os: windows-latest
            platform: "--win"
          - os: macos-latest
            platform: "--mac"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build app + CLI
        run: |
          npm run build
          npm run build:cli

      - name: Package installer
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # Build unsigned artifacts (no code-signing certs in CI).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codewiki-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: false
